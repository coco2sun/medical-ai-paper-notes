<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CocoSun - Biomedical AI</title>
  <meta name="description" content="CocoSun 的医学影像、数字病理、多模态组学、生物医学基础模型与 Biomedical Agents 论文笔记目录。">
  <style>
    :root {
      --ink: #172033;
      --muted: #667085;
      --line: #d9e2ec;
      --panel: #ffffff;
      --soft: #f5f8fb;
      --blue: #174a7c;
      --teal: #0f766e;
      --wine: #8f2444;
      --amber: #b26b14;
      --shadow: 0 16px 44px rgba(23, 32, 51, 0.10);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      background: #edf3f7;
      line-height: 1.65;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(237, 243, 247, 0) 0, #edf3f7 360px),
        linear-gradient(135deg, #123252, #0c6f69 58%, #7a2443);
    }

    .hero {
      max-width: 1120px;
      margin: 0 auto;
      padding: 56px 24px 36px;
      color: #fff;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #b9e7e1;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 860px;
      margin: 0;
      font-size: clamp(32px, 6vw, 58px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .hero-title {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 14px;
      max-width: 920px;
    }

    .hero-title .brand {
      font-weight: 900;
    }

    .hero-title .field {
      color: #d8fbf5;
      font-weight: 700;
    }

    .hero-copy {
      max-width: 760px;
      margin: 18px 0 0;
      color: rgba(255, 255, 255, 0.86);
      font-size: 18px;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .stat {
      min-width: 144px;
      padding: 13px 16px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.10);
    }

    .stat strong {
      display: block;
      font-size: 24px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 5px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 12px;
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px 24px 64px;
    }

    .toolbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 0 0 18px;
    }

    h2 {
      margin: 0;
      color: var(--blue);
      font-size: 24px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .note-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .note-card {
      display: flex;
      min-height: 330px;
      flex-direction: column;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .note-card:hover {
      transform: translateY(-2px);
      transition: transform 160ms ease;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .type {
      background: #e8f2f0;
      color: var(--teal);
    }

    .note-card h3 {
      margin: 0;
      color: var(--ink);
      font-size: 24px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .summary {
      margin: 14px 0 18px;
      color: var(--muted);
      font-size: 15px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: auto;
      padding-top: 8px;
    }

    .tag {
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #4c5b70;
      font-size: 12px;
      line-height: 1.2;
    }

    .open-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      min-height: 40px;
      margin-top: 22px;
      padding: 9px 14px;
      border-radius: var(--radius);
      background: var(--blue);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
    }

    .note-card.accent .open-link {
      background: var(--wine);
    }

    .archive-section {
      margin-top: 42px;
    }

    .archive-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
    }

    .note-list {
      display: grid;
      gap: 10px;
    }

    .note-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 17px 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 8px 24px rgba(23, 32, 51, 0.06);
    }

    .note-row-main {
      min-width: 0;
    }

    .note-row-title {
      display: inline-block;
      color: var(--ink);
      font-size: 17px;
      font-weight: 800;
      line-height: 1.35;
    }

    .note-row-title:hover,
    .open-link:hover {
      text-decoration: underline;
    }

    .note-row-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .note-row-summary {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .note-row-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
      max-width: 360px;
    }

    .footnote {
      margin: 26px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 760px) {
      .hero {
        padding-top: 38px;
      }

      .toolbar {
        display: block;
      }

      .note-grid {
        grid-template-columns: 1fr;
      }

      .note-card {
        min-height: 0;
        padding: 20px;
      }

      .archive-head {
        display: block;
      }

      .note-row {
        grid-template-columns: 1fr;
      }

      .note-row-tags {
        justify-content: flex-start;
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <p class="eyebrow">Paper Notes · Biomedical AI</p>
      <h1 class="hero-title">
        <span class="brand">CocoSun</span>
        <span class="field">- Biomedical AI</span>
      </h1>
      <p class="hero-copy">
        聚焦医学影像、数字病理、多模态组学与 AI 辅助研究，持续整理生物医学基础模型与生物医学 Agents 相关论文笔记。
      </p>
      <div class="stats" aria-label="站点概览">
        <div class="stat">
          <strong id="notes-count">2</strong>
          <span>已整理笔记</span>
        </div>
        <div class="stat">
          <strong id="topics-count">4</strong>
          <span>核心主题</span>
        </div>
        <div class="stat">
          <strong>HTML</strong>
          <span>当前写作格式</span>
        </div>
      </div>
    </header>

    <main>
      <div class="toolbar">
        <h2>最新笔记</h2>
      </div>

      <section class="note-grid" id="latest-notes" aria-label="最新论文笔记"></section>

      <section class="archive-section" aria-label="全部论文笔记">
        <div class="archive-head">
          <h2>全部笔记</h2>
        </div>
        <div class="note-list" id="all-notes"></div>
      </section>

      <p class="footnote">CocoSun · Biomedical AI paper notes · Contact: <a href="mailto:bitsunhui@163.com">bitsunhui@163.com</a></p>
    </main>
  </div>
  <script src="assets/notes-data.js?v=25c8df0d67"></script>
  <script>
    const notes = Array.isArray(window.NOTES) ? window.NOTES : [];
    const sortedNotes = [...notes].sort((a, b) => b.date.localeCompare(a.date));
    const latestNotes = sortedNotes.slice(0, 6);
    const uniqueTags = new Set(notes.flatMap((note) => note.tags));

    const tagMarkup = (tags) => tags.map((tag) => `<span class="tag">${tag}</span>`).join("");

    document.getElementById("notes-count").textContent = notes.length;
    document.getElementById("topics-count").textContent = uniqueTags.size;

    document.getElementById("latest-notes").innerHTML = latestNotes.map((note) => `
      <article class="note-card${note.accent ? " accent" : ""}">
        <div class="meta-row">
          <span class="pill type">${note.type}</span>
          <span class="pill">整理日期 · ${note.date}</span>
        </div>
        <h3>${note.title}</h3>
        <p class="summary">${note.summary}</p>
        <div class="tags">${tagMarkup(note.tags)}</div>
        <a class="open-link" href="${note.url}">进入文章</a>
      </article>
    `).join("");

    document.getElementById("all-notes").innerHTML = sortedNotes.map((note) => `
      <article class="note-row">
        <div class="note-row-main">
          <a class="note-row-title" href="${note.url}">${note.title}</a>
          <div class="note-row-meta">
            <span>${note.type}</span>
            <span>${note.date}</span>
          </div>
          <p class="note-row-summary">${note.summary}</p>
        </div>
        <div class="note-row-tags">${tagMarkup(note.tags.slice(0, 4))}</div>
      </article>
    `).join("");
  </script>
</body>
</html>
